<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="영상 초안에서 수정 위치 표시, AI 수정으로 이어지는 흐름"><rect width="900" height="280" rx="18" fill="#edf4ef"/><g font-family="sans-serif" fill="#173e32"><text x="30" y="40" font-size="18" font-weight="bold">말로 만들고, 화면으로 고칠 곳을 지정</text><g fill="#fff" stroke="#bfd4c5" stroke-width="2"><rect x="30" y="65" width="240" height="160" rx="12"/><rect x="330" y="65" width="240" height="160" rx="12"/><rect x="630" y="65" width="240" height="160" rx="12"/></g><text x="60" y="104" font-size="18">① AI가 초안 제작</text><rect x="65" y="125" width="165" height="55" rx="6" fill="#d4e7da"/><text x="145" y="157" text-anchor="middle" font-size="15">영상 프레임</text><text x="360" y="104" font-size="18">② 고칠 위치 표시</text><rect x="365" y="125" width="165" height="55" rx="6" fill="#d4e7da"/><text x="450" y="157" text-anchor="middle" font-size="15">제목</text><ellipse cx="450" cy="150" rx="42" ry="25" fill="none" stroke="#d37932" stroke-width="3"/><text x="660" y="104" font-size="18">③ 수정 요청</text><text x="660" y="151" font-size="17">“제목을 더 크게”</text><text x="660" y="185" font-size="15">결과를 보고 다시 편집</text><text x="290" y="154" font-size="30">→</text><text x="590" y="154" font-size="30">→</text><text x="30" y="257" font-size="14" fill="#567267">공식 기능 설명을 바탕으로 그린 개념도 · 실제 제품 화면 아님</text></g></svg>
