<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"><rect width="720" height="340" rx="16" fill="#f0f6f1"/><g font-family="sans-serif" fill="#172d2b"><text x="30" y="42" font-size="21" font-weight="bold">검사는 ‘실행 직전’에도 필요해요</text><rect x="30" y="75" width="190" height="100" rx="12" fill="white"/><text x="50" y="112" font-size="19">외부 도구 응답</text><text x="50" y="146" font-size="16">“환불이 실패했어요”</text><text x="235" y="134" font-size="28">→</text><rect x="280" y="75" width="180" height="100" rx="12" fill="#d9eadf"/><text x="300" y="112" font-size="19">실행 전 확인</text><text x="300" y="146" font-size="16">누가 허락했나요?</text><text x="478" y="134" font-size="28">→</text><rect x="525" y="75" width="165" height="100" rx="12" fill="white"/><text x="545" y="112" font-size="19">실제 환불</text><text x="545" y="146" font-size="16">허가된 것만</text><text x="30" y="231" font-size="18">완성된 보고서가 정상이어도,</text><text x="30" y="263" font-size="18">중간에 추가된 행동까지 정당한 것은 아니에요</text><text x="30" y="308" font-size="13" fill="#61716d">논문 사례를 단순화한 설명 그림 · 실제 제품 화면 아님</text></g></svg>