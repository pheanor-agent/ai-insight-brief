<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="워터마크가 알려주는 것과 알려주지 못하는 것"><rect width="900" height="280" rx="18" fill="#f1f4f7"/><g font-family="sans-serif"><rect x="24" y="24" width="402" height="215" rx="12" fill="#e0eee4"/><rect x="446" y="24" width="430" height="215" rx="12" fill="#fff"/><text x="48" y="65" fill="#185540" font-size="23" font-weight="bold">알 수 있는 단서</text><text x="48" y="112" fill="#234638" font-size="20">지원되는 AI가 글의 일부를</text><text x="48" y="147" fill="#234638" font-size="20">만들거나 처리했을 가능성</text><text x="48" y="200" fill="#5b7265" font-size="15">단, 탐지 오류와 누락이 있을 수 있음</text><text x="470" y="65" fill="#4a4f5a" font-size="23" font-weight="bold">이 표시만으로는 모르는 것</text><text x="470" y="111" fill="#4a4f5a" font-size="20">사람이 얼마나 기여했는지</text><text x="470" y="148" fill="#4a4f5a" font-size="20">글이 사실인지 · 누가 썼는지</text><text x="470" y="185" fill="#4a4f5a" font-size="20">누구에게 소유권이 있는지</text><text x="24" y="266" fill="#64716b" font-size="14">OpenAI의 한계 설명을 바탕으로 재구성 · 편집부 설명 그림</text></g></svg>
